{% extends "base.html" %}

{% block inhalt %}
<h1>Kursunterlagen</h1>

<p class="fuehrung">
	Gib den Zugangscode deines Kurses ein. Du bekommst ihn im Unterricht.
</p>

<form method="post" action="/zugang">
	<label for="code">Zugangscode</label>
	<input id="code" name="code" type="text" required autofocus autocomplete="off"
	       autocapitalize="off" spellcheck="false" placeholder="z. B. k7m3-rp29">
	<button type="submit">Unterlagen anzeigen</button>
</form>

<p class="klein">
	Gross- und Kleinschreibung spielt keine Rolle, der Bindestrich auch nicht.
</p>
{% endblock %}
