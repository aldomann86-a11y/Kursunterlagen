{% extends "base.html" %}
{% block titel %}Code eingeben – Kursunterlagen{% endblock %}

{% block inhalt %}
<h1>Code eingeben</h1>

<p class="fuehrung">Sechsstelliger Code aus deiner Authenticator-App.</p>

<form method="post" action="/admin/2fa">
	<label for="code">Code</label>
	<input id="code" name="code" type="text" required autofocus inputmode="numeric"
	       autocomplete="one-time-code" pattern="[0-9 ]{6,9}" maxlength="9">
	<button type="submit">Weiter</button>
</form>

<form method="post" action="/admin/abmelden" class="nebenbei">
	<button type="submit" class="leise">Abbrechen</button>
</form>
{% endblock %}
