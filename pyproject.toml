[project]
name = "kursunterlagen"
version = "0.1.0"
description = "Kursunterlagen-Portal: Unterlagen hochladen und mit einem Zugangscode herunterladen"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    # Zweiter Faktor für das Admin-Login (umschaltbar über ADMIN_2FA): pyotp rechnet die
    # Codes, segno zeichnet den QR-Code lokal – kein Dienst, keine Fremdquelle.
    "pyotp>=2.9",
    "segno>=1.6",
    # Zeitzonen-Daten: Windows und python:3.12-slim bringen keine mit, sonst scheitert
    # ZoneInfo("Europe/Zurich") beim Anzeigen von Zeiten.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
